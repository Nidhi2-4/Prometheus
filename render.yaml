services:
  - type: web
    name: swasthik-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: https://swasthikk.vercel.app,http://localhost:5173
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "1"
      - key: SESSION_SECRET
        value: swasthik-secret-key-2026
